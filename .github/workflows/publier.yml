# À chaque envoi sur « main » : fabrique KTEC.zip (le portail et le socle commun) et le publie dans les Releases.
# Les applications (BiRTEC, PDRTec, AITEC) ont chacune leur paquet, publié par leur propre dépôt.

name: Publier

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Vérification du code
        run: |
          for fichier in $(git ls-files '*.js'); do node --check "$fichier"; done

      - name: KTEC.zip
        run: |
          version="$(cat VERSION).${{ github.run_number }}"
          echo "$version" > VERSION
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p dist/KTEC
          cp -r serveur interface moteur-java outils docs VERSION package.json README.md nouveautes.json \
            "Lancer KTEC.bat" lancer-ktec.sh "Installer KTEC.bat" installer-ktec.sh dist/KTEC/
          chmod +x dist/KTEC/*.sh
          (cd dist && zip -qr KTEC.zip KTEC)

      - name: Release
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v$VERSION" dist/KTEC.zip --title "KTEC $VERSION" --notes "${NOTES:-Nouvelle version}"
          # On garde les 3 dernières versions
          gh release list --limit 100 --json tagName --jq '.[3:][].tagName' | while read -r ancienne; do
            gh release delete "$ancienne" --yes --cleanup-tag
          done
