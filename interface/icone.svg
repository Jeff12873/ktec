  <circle cx="420" cy="160" r="9" fill="#10b981"/>
  <circle cx="92" cy="324" r="8" fill="#a3e635"/>
  <circle cx="196" cy="74" r="7" fill="#ffffff"/>
  <circle cx="348" cy="424" r="9" fill="#2dd4bf"/>
